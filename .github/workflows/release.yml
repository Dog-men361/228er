name: Build signed APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
concurrency:
  group: lexrf-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          KEY_BASE64: ${{ secrets.LEXRF_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY_BASE64"
          printf '%s' "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/lexrf.p12"
      - name: Build
        shell: pwsh
        env:
          LEXRF_KEYSTORE: ${{ runner.temp }}/lexrf.p12
          LEXRF_KEY_PASSWORD: ${{ secrets.LEXRF_KEY_PASSWORD }}
        run: ./build.ps1 -Output "$PWD/LexRF.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: LexRF-apk
          path: LexRF.apk
      - name: Publish app version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo 'Tag and versionName must match'; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already published; increment versionCode and versionName for a new release."
          else
            gh release create "$TAG" LexRF.apk --target "$GITHUB_SHA" --generate-notes
          fi
